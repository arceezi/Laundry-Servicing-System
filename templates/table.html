<h2>Booked Orders</h2>

<!-- Table displaying all laundry bookings stored in the current session -->
<table>
  <thead>
    <tr>
      <!-- Auto-increment booking identifier -->
      <th>#</th>

      <!-- Customer details -->
      <th>Name</th>
      <th>Contact</th>

      <!-- Laundry information -->
      <th>kg</th>
      <th>Service</th>
      <th>Price/kg</th>

      <!-- Computed billing values -->
      <th>Subtotal</th>
      <th>Disc %</th>
      <th>Disc Amt</th>
      <th>Total</th>

      <!-- Timestamp of when the booking was saved (PH local time) -->
      <th>
        Timestamp
        <div class="table-note">Timezone: Asia/Manila (PH)</div>
      </th>
    </tr>
  </thead>

  <!-- Dynamic rows generated by PHP from session bookings -->
  <tbody>
    {{BOOKING_ROWS}}
  </tbody>
</table>
